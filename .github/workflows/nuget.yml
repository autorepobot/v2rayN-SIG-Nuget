name: 🀫 NuGet Cache (from source)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'
      nuget_cache_version:
        description: '本次生成的 nuget-cache release 版本号 (tag)'
        required: true
        default: ''

jobs:
  # =========================================================
  # Job 1: 在 x64 Runner 上【仅】还原 linux-arm64
  # =========================================================
  build-x64-runner:
    runs-on: ubuntu-24.04
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Clone source
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Install latest 10.0.1xx SDK patch version
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          mkdir -p /tmp/sdks/sdk
          ./dotnet-install.sh \
            --channel "10.0.1xx" \
            --install-dir /tmp/sdks/sdk

          echo "Installed SDK:"
          /tmp/sdks/sdk/dotnet --version

      - name: Download SkiaSharp and HarfBuzzSharp packages from GitHub Release
        run: |
          set -euo pipefail

          SKIA_VER="3.119.4"
          HARF_VER="8.3.1.5"
          RELEASE_TAG="v${SKIA_VER}"
          FEED="/tmp/local-feed-skia"

          mkdir -p "$FEED"

          curl -fL \
            -o "$FEED/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/${RELEASE_TAG}/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg"

          curl -fL \
            -o "$FEED/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/${RELEASE_TAG}/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg"

          echo "Downloaded SkiaSharp/HarfBuzzSharp packages:"
          ls -lh "$FEED"

      - name: Restore linux-arm64 ONLY
        run: |
          SDK_DIR="/tmp/sdks/sdk"
          SDK_VER="$("$SDK_DIR/dotnet" --version)"

          echo "==> [x64 Runner] Restoring linux-arm64 with SDK $SDK_VER"

          "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-x64 \
            --source /tmp/local-feed-skia \
            --source https://api.nuget.org/v3/index.json \
            -r linux-arm64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || true

      - name: Upload x64 runner cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-cache-x64-runner
          path: ./nuget-cache-x64/

  # =========================================================
  # Job 2: 在 ARM64 Runner 上处理 linux-x64, riscv64, loongarch64 & ppc64le
  # =========================================================
  build-arm64-runner:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Clone source
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Install latest 10.0.1xx SDK patch version
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          mkdir -p /tmp/sdks/sdk
          ./dotnet-install.sh \
            --channel "10.0.1xx" \
            --install-dir /tmp/sdks/sdk

          echo "Installed SDK:"
          /tmp/sdks/sdk/dotnet --version

      - name: Download SkiaSharp and HarfBuzzSharp packages from GitHub Release
        run: |
          set -euo pipefail

          SKIA_VER="3.119.4"
          HARF_VER="8.3.1.5"
          RELEASE_TAG="v${SKIA_VER}"
          FEED="/tmp/local-feed-skia"

          mkdir -p "$FEED"

          curl -fL \
            -o "$FEED/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/${RELEASE_TAG}/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg"

          curl -fL \
            -o "$FEED/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/${RELEASE_TAG}/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg"

          echo "Downloaded SkiaSharp/HarfBuzzSharp packages:"
          ls -lh "$FEED"

      - name: Restore linux-x64
        run: |
          SDK_DIR="/tmp/sdks/sdk"
          SDK_VER="$("$SDK_DIR/dotnet" --version)"

          echo "==> [ARM64 Runner] Restoring linux-x64 with SDK $SDK_VER"

          "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-skia \
            --source https://api.nuget.org/v3/index.json \
            -r linux-x64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || true

      - name: Restore linux-riscv64 using GitHub RISC-V packages
        run: |
          set -euo pipefail

          RISCV_VER="10.0.114"
          RTM_VER="${RISCV_VER%.*}.$(( ${RISCV_VER##*.} - 100 ))"

          mkdir -p /tmp/local-feed-riscv

          curl -fL \
            -o "/tmp/local-feed-riscv/microsoft.aspnetcore.app.runtime.linux-riscv64.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.AspNetCore.App.Runtime.linux-riscv64.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-riscv/microsoft.netcore.app.host.linux-riscv64.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.NETCore.App.Host.linux-riscv64.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-riscv/microsoft.netcore.app.runtime.linux-riscv64.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.NETCore.App.Runtime.linux-riscv64.${RTM_VER}.nupkg"

          /tmp/sdks/sdk/dotnet restore \
            source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-skia \
            --source /tmp/local-feed-riscv \
            --source https://api.nuget.org/v3/index.json \
            -r linux-riscv64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-riscv64 restore 部分失败"

      - name: Restore loongarch64 using Loongson NuGet source
        run: |
          LOONG_VER="10.0.114"
          LOONG_NUPKG_VER="${LOONG_VER%.*}.$(( ${LOONG_VER##*.} - 100 ))"

          mkdir -p "/tmp/sdks/sdk-loong"
          ./dotnet-install.sh --version "$LOONG_VER" --install-dir "/tmp/sdks/sdk-loong"

          mkdir -p "/tmp/local-feed-loong"

          curl -fL \
            -o "/tmp/local-feed-loong/Microsoft.AspNetCore.App.Runtime.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${LOONG_NUPKG_VER}/Microsoft.AspNetCore.App.Runtime.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-loong/Microsoft.NETCore.App.Host.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${LOONG_NUPKG_VER}/Microsoft.NETCore.App.Host.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-loong/Microsoft.NETCore.App.Runtime.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${LOONG_NUPKG_VER}/Microsoft.NETCore.App.Runtime.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-loong/Microsoft.NETCore.App.Runtime.NativeAOT.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${LOONG_NUPKG_VER}/Microsoft.NETCore.App.Runtime.NativeAOT.linux-loongarch64.${LOONG_NUPKG_VER}.nupkg"

          echo "Downloaded LoongArch64 local NuGet packages:"
          ls -lh "/tmp/local-feed-loong"

          "/tmp/sdks/sdk-loong/dotnet" nuget add source \
            "https://lnuget.loongnix.cn/v3/index.json" \
            -n lnuget.loongnix.cn \
            --protocol-version 3 \
            --allow-insecure-connections || true

          echo "==> Restoring linux-loongarch64 with SDK $LOONG_VER from local + Loongson feeds..."
          "/tmp/sdks/sdk-loong/dotnet" restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-skia \
            --source /tmp/local-feed-loong \
            --source https://lnuget.loongnix.cn/v3/index.json \
            --source https://api.nuget.org/v3/index.json \
            -r linux-loongarch64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-loongarch64 restore 部分失败"

      - name: Restore linux-ppc64le using GitHub SkiaSharp/HarfBuzzSharp packages
        run: |
          set -euo pipefail

          PPC_VER="10.0.114"
          RTM_VER="${PPC_VER%.*}.$(( ${PPC_VER##*.} - 100 ))"

          mkdir -p /tmp/local-feed-ppc

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.aspnetcore.app.runtime.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.AspNetCore.App.Runtime.linux-ppc64le.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.netcore.app.host.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.NETCore.App.Host.linux-ppc64le.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.netcore.app.runtime.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${RTM_VER}/Microsoft.NETCore.App.Runtime.linux-ppc64le.${RTM_VER}.nupkg"

          ./dotnet-install.sh \
            --version "$PPC_VER" \
            --install-dir "/tmp/sdks/sdk-ppc"

          "/tmp/sdks/sdk-ppc/dotnet" restore \
            source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-skia \
            --source /tmp/local-feed-ppc \
            --source https://api.nuget.org/v3/index.json \
            -r linux-ppc64le \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-ppc64le restore 部分失败"

      - name: Restore linux-x86 using GitHub x86 NuGet packages
        run: |
          set -euo pipefail

          X86_SDK_VER="10.0.114"
          X86_NUPKG_VER="${X86_SDK_VER%.*}.$(( ${X86_SDK_VER##*.} - 100 ))"

          mkdir -p /tmp/local-feed-x86

          curl -fL \
            -o "/tmp/local-feed-x86/Microsoft.AspNetCore.App.Runtime.linux-x86.${X86_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${X86_NUPKG_VER}/Microsoft.AspNetCore.App.Runtime.linux-x86.${X86_NUPKG_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-x86/Microsoft.NETCore.App.Host.linux-x86.${X86_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${X86_NUPKG_VER}/Microsoft.NETCore.App.Host.linux-x86.${X86_NUPKG_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-x86/Microsoft.NETCore.App.Runtime.linux-x86.${X86_NUPKG_VER}.nupkg" \
            "https://github.com/autorepobot/dotnet-nupkg-prebuild/releases/download/${X86_NUPKG_VER}/Microsoft.NETCore.App.Runtime.linux-x86.${X86_NUPKG_VER}.nupkg"

          echo "Downloaded Linux x86 local NuGet packages:"
          ls -lh "/tmp/local-feed-x86"

          ./dotnet-install.sh \
            --version "$X86_SDK_VER" \
            --install-dir "/tmp/sdks/sdk-x86"

          SDK_PROPS="/tmp/sdks/sdk-x86/sdk/${X86_SDK_VER}/Microsoft.NETCoreSdk.BundledVersions.props"

          echo "Patching $SDK_PROPS ..."

          python3 - "$SDK_PROPS" <<'PY2'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          old = text

          def append_identifier(text, marker, attr):
              start = 0
              changed = False

              while True:
                  start = text.find(marker, start)
                  if start == -1:
                      break

                  end = text.find("/>", start)
                  if end == -1:
                      break

                  block = text[start:end]
                  attr_pos = block.find(attr)

                  if attr_pos != -1:
                      value_start = attr_pos + len(attr)
                      value_end = block.find('"', value_start)

                      if value_end != -1:
                          value = block[value_start:value_end]

                          if "linux-x86" not in value.split(";"):
                              new_value = value + ";linux-x86"
                              block = (
                                  block[:value_start]
                                  + new_value
                                  + block[value_end:]
                              )

                              text = (
                                  text[:start]
                                  + block
                                  + text[end:]
                              )

                              end = start + len(block)
                              changed = True

                  start = end + 2

              return text, changed

          for framework in (
              "Microsoft.NETCore.App",
              "Microsoft.AspNetCore.App",
          ):
              marker = f'", start)
              if end == -1:
                  break

              block = text[start:end]

              if (
                  'Include="Microsoft.NETCore.App"' in block
                  or 'Update="Microsoft.NETCore.App"' in block
              ):
                  attr = 'AppHostRuntimeIdentifiers="'
                  attr_pos = block.find(attr)

                  if attr_pos != -1:
                      value_start = attr_pos + len(attr)
                      value_end = block.find('"', value_start)

                      if value_end != -1:
                          value = block[value_start:value_end]

                          if "linux-x86" not in value.split(";"):
                              new_value = value + ";linux-x86"
                              block = (
                                  block[:value_start]
                                  + new_value
                                  + block[value_end:]
                              )

                              text = (
                                  text[:start]
                                  + block
                                  + text[end:]
                              )

                              end = start + len(block)
                              apphost_changed = True

              start = end + 2

          if text == old:
              raise SystemExit(
                  "ERROR: No RuntimePackRuntimeIdentifiers or AppHostRuntimeIdentifiers entry was patched"
              )

          path.write_text(text)
PY2

          echo "==> Restoring linux-x86 with patched SDK $X86_SDK_VER from local feeds..."
          "/tmp/sdks/sdk-x86/dotnet" restore \
            source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-skia \
            --source /tmp/local-feed-x86 \
            --source https://api.nuget.org/v3/index.json \
            -r linux-x86 \
            -p:SelfContained=true \
            -p:EnableWindowsTargeting=true \
            --force-evaluate \
            --ignore-failed-sources || echo "警告: linux-x86 restore 部分失败"

      - name: Upload ARM64 runner cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-cache-arm64-runner
          path: ./nuget-cache-arm/

  # =========================================================
  # Job 3: 提取 .nupkg 纯包源 & 压缩发布
  # =========================================================
  merge-and-release:
    needs: [build-x64-runner, build-arm64-runner]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Merge caches & deduplicate (.nupkg only)
        run: |
          set -euo pipefail

          mkdir -p ./nuget-cache

          echo "提取全部 .nupkg 文件至 nuget-cache..."
          find ./artifacts -type f -name "*.nupkg" ! -name "*.snupkg" -exec cp -f {} ./nuget-cache/ \;

          echo "提取完成，.nupkg 包总数: $(ls -1 ./nuget-cache | wc -l)"

      - name: Compress NuGet cache
        run: |
          XZ_OPT="-T0 --lzma2=preset=9e,dict=256MiB,lc=4,pb=0,depth=768" tar --sort=name -cJf nuget-cache.tar.xz nuget-cache

      - name: Create Release with cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.nuget_cache_version }}" --repo ${{ github.repository }} --yes || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            --delete "${{ inputs.nuget_cache_version }}" || true

          gh release create "${{ inputs.nuget_cache_version }}" \
            nuget-cache.tar.xz \
            --repo ${{ github.repository }} \
            --title "${{ inputs.nuget_cache_version }}" \
            --notes "源码版本: ${{ inputs.source_ref }} / 缓存版本: ${{ inputs.nuget_cache_version }}"
