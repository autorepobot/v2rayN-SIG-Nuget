name: 🀫 NuGet Cache (from source)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'
      nuget_cache_version:
        description: '本次生成的 nuget-cache release 版本号 (tag)'
        required: true
        default: ''
jobs:
  build-cache:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0
      - name: Clone source at specified ref
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source
      - name: Install latest two 10.0.1xx SDK patch versions
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          mkdir -p /tmp/sdks/sdk1
          ./dotnet-install.sh --channel "10.0.1xx" --install-dir /tmp/sdks/sdk1
          LATEST=$(/tmp/sdks/sdk1/dotnet --version)
          echo "最新版本: $LATEST"

          MAJOR_MINOR=$(echo "$LATEST" | cut -d. -f1,2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          PREV="$MAJOR_MINOR.$((PATCH - 1))"
          echo "上一个版本: $PREV"

          mkdir -p /tmp/sdks/sdk2
          ./dotnet-install.sh --version "$PREV" --install-dir /tmp/sdks/sdk2

          printf '%s\n%s\n' "$LATEST" "$PREV" > /tmp/sdk-versions.txt
          echo "取得的 SDK 版本:"
          cat /tmp/sdk-versions.txt
      - name: Restore for each SDK version (linux-x64 / linux-arm64 only)
        run: |
          RIDS="linux-x64 linux-arm64"
          i=0
          while read -r VER; do
            i=$((i+1))
            SDK_DIR="/tmp/sdks/sdk$i"
            echo "########## 使用 SDK $VER ($SDK_DIR) ##########"
            for RID in $RIDS; do
              echo "==> [$VER] Restoring for RID: $RID"
              "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
                --packages ./nuget-cache \
                -r "$RID" \
                -p:EnableWindowsTargeting=true \
                --ignore-failed-sources || echo "警告: [$VER] $RID restore 部分失败，继续下一个"
            done
          done < /tmp/sdk-versions.txt
      - name: Restore riscv64 / loongarch64 using their own SDK's native version
        run: |
          # RISC-V64：先提取 SDK 自带的 packs，再用它自己的 dotnet 还原
          curl -fL -o riscv64-sdk.tar.gz \
            "https://github.com/xujiegb/dotnet-riscv/releases/download/10.0.111/dotnet-sdk-10.0.111-linux-riscv64.tar.gz"
          mkdir -p /tmp/sdks/riscv64
          tar -xzf riscv64-sdk.tar.gz -C /tmp/sdks/riscv64
          rm -f riscv64-sdk.tar.gz
          echo "==> Restoring for RID: linux-riscv64"
          /tmp/sdks/riscv64/dotnet restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache \
            -r linux-riscv64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-riscv64 restore 部分失败，继续下一个"

          # 把 riscv64 SDK 自带的 packs 一并写入 nuget-cache
          for dir in /tmp/sdks/riscv64/packs/*/; do
            name=$(basename "$dir")
            lower_name=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            mkdir -p "./nuget-cache/$lower_name"
            cp -r "$dir"* "./nuget-cache/$lower_name/"
          done

          # LoongArch64：先提取 SDK 自带的 packs，再用它自己的 dotnet 还原
          curl -fL -o loongarch64-sdk.tar.gz \
            "https://github.com/loongson/dotnet/releases/download/v10.0.110-loongarch64/dotnet-sdk-10.0.110-linux-loongarch64.tar.gz"
          mkdir -p /tmp/sdks/loongarch64
          tar -xzf loongarch64-sdk.tar.gz -C /tmp/sdks/loongarch64
          rm -f loongarch64-sdk.tar.gz
          echo "==> Restoring for RID: linux-loongarch64"
          /tmp/sdks/loongarch64/dotnet restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache \
            -r linux-loongarch64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-loongarch64 restore 部分失败，继续下一个"

          # 把 loongarch64 SDK 自带的 packs 一并写入 nuget-cache
          for dir in /tmp/sdks/loongarch64/packs/*/; do
            name=$(basename "$dir")
            lower_name=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            mkdir -p "./nuget-cache/$lower_name"
            cp -r "$dir"* "./nuget-cache/$lower_name/"
          done

          rm -rf /tmp/sdks/riscv64 /tmp/sdks/loongarch64
      - name: Optimize cache size (remove temp files)
        run: |
          find ./nuget-cache -name "*.lock" -delete
          find ./nuget-cache -name "*.tmp" -delete
      - name: Compress NuGet cache
        run: |
          tar -czf nuget-cache.tar.gz nuget-cache
      - name: Create Release with cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.nuget_cache_version }}" --repo ${{ github.repository }} --yes || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            --delete "${{ inputs.nuget_cache_version }}" || true
          gh release create "${{ inputs.nuget_cache_version }}" \
            nuget-cache.tar.gz \
            --repo ${{ github.repository }} \
            --title "${{ inputs.nuget_cache_version }}" \
            --notes "源码版本: ${{ inputs.source_ref }} / 缓存版本: ${{ inputs.nuget_cache_version }}"
