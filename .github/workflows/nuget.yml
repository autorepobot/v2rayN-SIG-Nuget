name: 🀫 NuGet Cache (from source)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'
      nuget_cache_version:
        description: '本次生成的 nuget-cache release 版本号 (tag)'
        required: true
        default: ''

jobs:
  # =========================================================
  # Job 1: 在 x64 Runner 上【仅】还原 linux-arm64
  # =========================================================
  build-x64-runner:
    runs-on: ubuntu-24.04
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Clone source
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Install latest two 10.0.1xx SDK patch versions
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          mkdir -p /tmp/sdks/sdk1
          ./dotnet-install.sh --channel "10.0.1xx" --install-dir /tmp/sdks/sdk1
          LATEST=$(/tmp/sdks/sdk1/dotnet --version)

          MAJOR_MINOR=$(echo "$LATEST" | cut -d. -f1,2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          PREV="$MAJOR_MINOR.$((PATCH - 1))"

          mkdir -p /tmp/sdks/sdk2
          ./dotnet-install.sh --version "$PREV" --install-dir /tmp/sdks/sdk2

          printf '%s\n%s\n' "$LATEST" "$PREV" > /tmp/sdk-versions.txt

      - name: Restore linux-arm64 ONLY
        run: |
          i=0
          while read -r VER; do
            i=$((i+1))
            SDK_DIR="/tmp/sdks/sdk$i"
            echo "==> [x64 Runner] Restoring linux-arm64 with SDK $VER"
            "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
              --packages ./nuget-cache-x64 \
              -r linux-arm64 \
              -p:EnableWindowsTargeting=true \
              --ignore-failed-sources || true
          done < /tmp/sdk-versions.txt

      - name: Upload x64 runner cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-cache-x64-runner
          path: ./nuget-cache-x64/

  # =========================================================
  # Job 2: 在 ARM64 Runner 上处理 linux-x64, riscv64, loongarch64 & ppc64le
  # =========================================================
  build-arm64-runner:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Clone source
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Install latest two 10.0.1xx SDK patch versions
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          mkdir -p /tmp/sdks/sdk1
          ./dotnet-install.sh --channel "10.0.1xx" --install-dir /tmp/sdks/sdk1
          LATEST=$(/tmp/sdks/sdk1/dotnet --version)

          MAJOR_MINOR=$(echo "$LATEST" | cut -d. -f1,2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          PREV="$MAJOR_MINOR.$((PATCH - 1))"

          mkdir -p /tmp/sdks/sdk2
          ./dotnet-install.sh --version "$PREV" --install-dir /tmp/sdks/sdk2

          printf '%s\n%s\n' "$LATEST" "$PREV" > /tmp/sdk-versions.txt

      - name: Restore linux-x64
        run: |
          i=0
          while read -r VER; do
            i=$((i+1))
            SDK_DIR="/tmp/sdks/sdk$i"
            echo "==> [ARM64 Runner] Restoring linux-x64 with SDK $VER"
            "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
              --packages ./nuget-cache-arm \
              -r linux-x64 \
              -p:EnableWindowsTargeting=true \
              --ignore-failed-sources || true
          done < /tmp/sdk-versions.txt

      # ---------------------------------------------------------
      # RISC-V64：解压完整 SDK 并解绑软链接，生成真实体包
      # ---------------------------------------------------------
      - name: Restore riscv64 using custom SDK packs
        run: |
          mkdir -p /tmp/local-feed /tmp/sdks/riscv64-sdk

          RISCV_VER="10.0.111"
          curl -fL -o riscv64-sdk.tar.gz "https://github.com/xujiegb/dotnet-riscv/releases/download/${RISCV_VER}/dotnet-sdk-${RISCV_VER}-linux-riscv64.tar.gz"

          # 1. 重点：解压完整 SDK（不加 ./packs 限制），保留 shared 目录供软链接解析
          tar -xzf riscv64-sdk.tar.gz -C /tmp/sdks/riscv64-sdk
          rm -f riscv64-sdk.tar.gz

          # 2. 遍历打包
          find /tmp/sdks/riscv64-sdk/packs -path "*/packs/*/*" -type d | while read -r pack_ver_dir; do
            VER=$(basename "$pack_ver_dir")
            PACK_DIR=$(dirname "$pack_ver_dir")
            PKG_ID=$(basename "$PACK_DIR")
            if [[ ! "$VER" =~ ^[0-9] ]]; then continue; fi

            # 过滤：如果包名包含 linux- 却不是 riscv64（比如 loongarch64），直接跳过
            if [[ "$PKG_ID" =~ linux- && ! "$PKG_ID" =~ riscv64 ]]; then
              echo "跳过非 riscv64 包: $PKG_ID"
              continue
            fi

            BUILD_DIR=$(mktemp -d)

            # 3. 重点：通过 cp -rL 将软链接指向的 shared/ 实体文件彻底“解绑/复制”进来
            cp -rL "$pack_ver_dir"/* "$BUILD_DIR/"

            echo '<?xml version="1.0" encoding="utf-8"?>
            <package xmlns="http://schemas.microsoft.com/packaging/2012/06/nuspec.xsd">
              <metadata>
                <id>'"$PKG_ID"'</id>
                <version>'"$VER"'</version>
                <authors>Microsoft</authors>
                <description>Repackaged RISC-V packs with real binaries</description>
              </metadata>
            </package>' > "$BUILD_DIR/$PKG_ID.nuspec"

            LOWER_ID=$(echo "$PKG_ID" | tr '[:upper:]' '[:lower:]')
            (cd "$BUILD_DIR" && zip -rq "/tmp/local-feed/${LOWER_ID}.${VER}.nupkg" .)
            rm -rf "$BUILD_DIR"
            echo "打包完成实体包: ${LOWER_ID}.${VER}.nupkg"
          done

          echo "==> Restoring linux-riscv64..."
          /tmp/sdks/sdk1/dotnet restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed \
            --source https://api.nuget.org/v3/index.json \
            -r linux-riscv64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || true

      # ---------------------------------------------------------
      # LoongArch64：配置龙芯源 + 匹配对应版 ARM64 SDK 直接 Restore
      # ---------------------------------------------------------
      - name: Restore loongarch64 using Loongson NuGet source
        run: |
          LOONG_VER="10.0.111"

          mkdir -p "/tmp/sdks/sdk-loong"
          ./dotnet-install.sh --version "$LOONG_VER" --install-dir "/tmp/sdks/sdk-loong"

          "/tmp/sdks/sdk-loong/dotnet" nuget add source \
            "https://lnuget.loongnix.cn/v3/index.json" \
            -n lnuget.loongnix.cn \
            --protocol-version 3 \
            --allow-insecure-connections || true

          echo "==> Restoring linux-loongarch64 with SDK $LOONG_VER from Loongson feed..."
          "/tmp/sdks/sdk-loong/dotnet" restore source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            -r linux-loongarch64 \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-loongarch64 restore 部分失败"

      # ---------------------------------------------------------
      # PPC64LE：拉取第三方原生包与 IBM 运行时资源包本地还原
      # ---------------------------------------------------------
      - name: Restore linux-ppc64le using native assets and IBM feed
        run: |
          set -euo pipefail

          PPC_VER="10.0.111"
          RTM_VER="${PPC_VER%.*}.$(( ${PPC_VER##*.} - 100 ))"

          SKIA_VER="3.119.4"
          HARF_VER="8.3.1.5"

          mkdir -p \
            /tmp/local-feed-ppc \
            /tmp/official-nupkgs \
            /tmp/ppc-nupkgs \
            /tmp/merged-nupkgs \
            /tmp/sdks/sdk-ppc

          curl -fL \
            -o "/tmp/ppc-nupkgs/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/v${SKIA_VER}/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg"

          curl -fL \
            -o "/tmp/ppc-nupkgs/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            "https://github.com/autorepobot/SkiaSharp-ppc64le/releases/download/v${SKIA_VER}/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg"

          curl -fL \
            -o "/tmp/official-nupkgs/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/skiasharp.nativeassets.linux/${SKIA_VER}/skiasharp.nativeassets.linux.${SKIA_VER}.nupkg"

          curl -fL \
            -o "/tmp/official-nupkgs/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/harfbuzzsharp.nativeassets.linux/${HARF_VER}/harfbuzzsharp.nativeassets.linux.${HARF_VER}.nupkg"

          merge_native_package() {
            local PACKAGE_ID="$1"
            local VERSION="$2"
            local OFFICIAL_NUPKG="$3"
            local PPC_NUPKG="$4"

            local WORK_DIR
            local OFFICIAL_DIR
            local PPC_DIR
            local MERGED_NUPKG
            local CACHE_DIR

            WORK_DIR=$(mktemp -d)
            OFFICIAL_DIR="$WORK_DIR/official"
            PPC_DIR="$WORK_DIR/ppc"

            mkdir -p \
              "$OFFICIAL_DIR" \
              "$PPC_DIR"

            unzip -q \
              "$OFFICIAL_NUPKG" \
              -d "$OFFICIAL_DIR"

            find "$OFFICIAL_DIR" \
              -name '.signature.p7s' \
              -type f \
              -delete

            rm -f \
              "$OFFICIAL_DIR/package/services/metadata/signatures.xml"

            unzip -q \
              "$PPC_NUPKG" \
              -d "$PPC_DIR"

            test -d "$PPC_DIR/runtimes/linux-ppc64le"

            rm -rf \
              "$OFFICIAL_DIR/runtimes/linux-ppc64le"

            mkdir -p \
              "$OFFICIAL_DIR/runtimes"

            cp -a \
              "$PPC_DIR/runtimes/linux-ppc64le" \
              "$OFFICIAL_DIR/runtimes/"

            test -d \
              "$OFFICIAL_DIR/runtimes/linux-ppc64le"

            MERGED_NUPKG="/tmp/merged-nupkgs/$(basename "$OFFICIAL_NUPKG")"

            (
              cd "$OFFICIAL_DIR"
              zip -9 -rq \
                "$MERGED_NUPKG" \
                .
            )

            unzip -l "$MERGED_NUPKG" |
              grep -q 'runtimes/linux-ppc64le/'

            CACHE_DIR="./nuget-cache-arm/${PACKAGE_ID}/${VERSION}"

            rm -rf "$CACHE_DIR"

            rm -rf \
              "$WORK_DIR"
          }

          merge_native_package \
            "skiasharp.nativeassets.linux" \
            "$SKIA_VER" \
            "/tmp/official-nupkgs/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            "/tmp/ppc-nupkgs/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg"

          merge_native_package \
            "harfbuzzsharp.nativeassets.linux" \
            "$HARF_VER" \
            "/tmp/official-nupkgs/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            "/tmp/ppc-nupkgs/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg"

          cp \
            "/tmp/merged-nupkgs/SkiaSharp.NativeAssets.Linux.${SKIA_VER}.nupkg" \
            /tmp/local-feed-ppc/

          cp \
            "/tmp/merged-nupkgs/HarfBuzzSharp.NativeAssets.Linux.${HARF_VER}.nupkg" \
            /tmp/local-feed-ppc/

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.aspnetcore.app.runtime.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/IBM/dotnet-s390x/releases/download/v${PPC_VER}/Microsoft.AspNetCore.App.Runtime.linux-ppc64le.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.netcore.app.host.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/IBM/dotnet-s390x/releases/download/v${PPC_VER}/Microsoft.NETCore.App.Host.linux-ppc64le.${RTM_VER}.nupkg"

          curl -fL \
            -o "/tmp/local-feed-ppc/microsoft.netcore.app.runtime.linux-ppc64le.${RTM_VER}.nupkg" \
            "https://github.com/IBM/dotnet-s390x/releases/download/v${PPC_VER}/Microsoft.NETCore.App.Runtime.linux-ppc64le.${RTM_VER}.nupkg"

          ./dotnet-install.sh \
            --version "$PPC_VER" \
            --install-dir "/tmp/sdks/sdk-ppc"

          "/tmp/sdks/sdk-ppc/dotnet" restore \
            source/v2rayN/v2rayN.sln \
            --packages ./nuget-cache-arm \
            --source /tmp/local-feed-ppc \
            --source https://api.nuget.org/v3/index.json \
            -r linux-ppc64le \
            -p:EnableWindowsTargeting=true \
            --ignore-failed-sources || echo "警告: linux-ppc64le restore 部分失败"

      - name: Upload ARM64 runner cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-cache-arm64-runner
          path: ./nuget-cache-arm/

  # =========================================================
  # Job 3: 合并缓存 & 发布 Release
  # =========================================================
  merge-and-release:
    needs: [build-x64-runner, build-arm64-runner]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Merge caches & deduplicate
        run: |
          set -euo pipefail

          mkdir -p ./nuget-cache

          echo "合并 x64-runner 产物 (arm64 缓存)..."
          rsync -av \
            --exclude='skiasharp.nativeassets.linux/' \
            --exclude='harfbuzzsharp.nativeassets.linux/' \
            ./artifacts/nuget-cache-x64-runner/ \
            ./nuget-cache/

          echo "合并 arm64-runner 产物 (x64, riscv64, loongarch64, ppc64le 缓存)..."
          rsync -av \
            --exclude='skiasharp.nativeassets.linux/' \
            --exclude='harfbuzzsharp.nativeassets.linux/' \
            ./artifacts/nuget-cache-arm64-runner/ \
            ./nuget-cache/

          echo "ARM64 SkiaSharp cache:"
          find \
            ./artifacts/nuget-cache-arm64-runner/skiasharp.nativeassets.linux \
            -mindepth 1 \
            -maxdepth 2 \
            -print

          echo "ARM64 HarfBuzzSharp cache:"
          find \
            ./artifacts/nuget-cache-arm64-runner/harfbuzzsharp.nativeassets.linux \
            -mindepth 1 \
            -maxdepth 2 \
            -print

          SKIA_DIR=$(find \
            ./artifacts/nuget-cache-arm64-runner/skiasharp.nativeassets.linux \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          HARF_DIR=$(find \
            ./artifacts/nuget-cache-arm64-runner/harfbuzzsharp.nativeassets.linux \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            -quit)

          echo "SKIA_DIR=$SKIA_DIR"
          echo "HARF_DIR=$HARF_DIR"

          test -n "$SKIA_DIR"
          test -n "$HARF_DIR"

          SKIA_VERSION=$(basename "$SKIA_DIR")
          HARF_VERSION=$(basename "$HARF_DIR")

          rm -rf \
            ./nuget-cache/skiasharp.nativeassets.linux \
            ./nuget-cache/harfbuzzsharp.nativeassets.linux

          mkdir -p \
            ./nuget-cache/skiasharp.nativeassets.linux \
            ./nuget-cache/harfbuzzsharp.nativeassets.linux

          cp -a \
            "$SKIA_DIR" \
            ./nuget-cache/skiasharp.nativeassets.linux/

          cp -a \
            "$HARF_DIR" \
            ./nuget-cache/harfbuzzsharp.nativeassets.linux/

          find ./nuget-cache -name "*.lock" -delete
          find ./nuget-cache -name "*.tmp" -delete

          SKIA_CACHE_DIR="$SKIA_DIR"
          HARF_CACHE_DIR="$HARF_DIR"

          test -d \
            "$SKIA_CACHE_DIR/runtimes/linux-ppc64le"

          test -d \
            "$HARF_CACHE_DIR/runtimes/linux-ppc64le"

          SKIA_NUPKG=$(find \
            "$SKIA_CACHE_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.nupkg' \
            -print \
            -quit)

          HARF_NUPKG=$(find \
            "$HARF_CACHE_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.nupkg' \
            -print \
            -quit)

          test -n "$SKIA_NUPKG"
          test -n "$HARF_NUPKG"

          unzip -l "$SKIA_NUPKG" |
            grep -q 'runtimes/linux-ppc64le/'

          unzip -l "$HARF_NUPKG" |
            grep -q 'runtimes/linux-ppc64le/'

          SKIA_NUPKG_COUNT=$(find \
            "$SKIA_CACHE_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.nupkg' |
            wc -l)

          HARF_NUPKG_COUNT=$(find \
            "$HARF_CACHE_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.nupkg' |
            wc -l)

          test "$SKIA_NUPKG_COUNT" -eq 1
          test "$HARF_NUPKG_COUNT" -eq 1

          echo "SkiaSharp version: $SKIA_VERSION"
          echo "HarfBuzzSharp version: $HARF_VERSION"
          echo "SkiaSharp nupkg count: $SKIA_NUPKG_COUNT"
          echo "HarfBuzzSharp nupkg count: $HARF_NUPKG_COUNT"

          echo "合并完成，顶级依赖包数量: $(ls -1 ./nuget-cache | wc -l)"

      - name: Compress NuGet cache
        run: |
          XZ_OPT="-9 -T0" tar -cJf nuget-cache.tar.xz nuget-cache

      - name: Create Release with cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.nuget_cache_version }}" --repo ${{ github.repository }} --yes || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}GitHub.com/${{ github.repository }}.git" \
            --delete "${{ inputs.nuget_cache_version }}" || true

          gh release create "${{ inputs.nuget_cache_version }}" \
            nuget-cache.tar.xz \
            --repo ${{ github.repository }} \
            --title "${{ inputs.nuget_cache_version }}" \
            --notes "源码版本: ${{ inputs.source_ref }} / 缓存版本: ${{ inputs.nuget_cache_version }}"
