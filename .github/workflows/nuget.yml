name: 🀫 NuGet Cache (from v2rayN-SIG)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'

jobs:
  build-cache:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Clone source at specified ref
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.1xx'

      - name: Restore NuGet packages
        run: |
          dotnet restore source/v2rayN/v2rayN.sln --packages ./nuget-cache -p:EnableWindowsTargeting=true

      - name: Optimize cache size (remove temp files)
        run: |
          find ./nuget-cache -name "*.lock" -delete
          find ./nuget-cache -name "*.tmp" -delete

      - name: Compress NuGet cache
        run: |
          tar -czf nuget-cache.tar.gz nuget-cache

      - name: Create Release with cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nuget-cache-${{ inputs.source_ref }}"
          gh release delete "$TAG" --repo ${{ github.repository }} --yes || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete "$TAG" || true
          gh release create "$TAG" nuget-cache.tar.gz \
            --repo ${{ github.repository }} \
            --title "NuGet Cache for v2rayN-SIG@${{ inputs.source_ref }}" \
            --notes "根据 autorepobot/v2rayN-SIG@${{ inputs.source_ref }} restore 生成的 NuGet 缓存"
