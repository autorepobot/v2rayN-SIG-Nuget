name: 🀫 NuGet Cache (from source)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'
      nuget_cache_version:
        description: '本次生成的 nuget-cache release 版本号 (tag)'
        required: true
        default: ''
jobs:
  build-cache:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0
      - name: Clone source at specified ref
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source
      - name: Discover latest two 10.0.1xx SDK patch versions
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

          get_resolved_version() {
            ./dotnet-install.sh --channel "$1" --dry-run 2>&1 \
              | grep -oP '(?<=Version: )[0-9]+\.[0-9]+\.[0-9]+' | head -1
          }

          LATEST=$(get_resolved_version "10.0.1xx")
          if [ -z "$LATEST" ]; then
            echo "无法解析最新 10.0.1xx 版本" >&2
            exit 1
          fi
          echo "最新版本: $LATEST"

          MAJOR_MINOR=$(echo "$LATEST" | cut -d. -f1,2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)

          PREV=""
          TRY_PATCH=$((PATCH - 1))
          while [ "$TRY_PATCH" -gt 0 ]; do
            CANDIDATE="$MAJOR_MINOR.$TRY_PATCH"
            RESOLVED=$(get_resolved_version "$CANDIDATE")
            if [ -n "$RESOLVED" ]; then
              PREV="$RESOLVED"
              break
            fi
            TRY_PATCH=$((TRY_PATCH - 1))
          done

          if [ -z "$PREV" ]; then
            echo "未能找到上一个可用版本，仅使用最新版本" >&2
            echo "$LATEST" > /tmp/sdk-versions.txt
          else
            printf '%s\n%s\n' "$LATEST" "$PREV" > /tmp/sdk-versions.txt
          fi

          echo "取得的 SDK 版本:"
          cat /tmp/sdk-versions.txt
      - name: Install both SDK versions
        run: |
          mkdir -p /tmp/sdks
          i=0
          while read -r VER; do
            i=$((i+1))
            echo "==> 安装 SDK $VER 到 /tmp/sdks/sdk$i"
            ./dotnet-install.sh --version "$VER" --install-dir "/tmp/sdks/sdk$i"
          done < /tmp/sdk-versions.txt
      - name: Extract riscv64 and loongarch64 runtime packs (latest source)
        run: |
          mkdir -p /tmp/riscv64-sdk /tmp/loongarch64-sdk

          curl -fL -o riscv64-sdk.tar.gz \
            "https://github.com/xujiegb/dotnet-riscv/releases/download/10.0.111/dotnet-sdk-10.0.111-linux-riscv64.tar.gz"
          tar -xzf riscv64-sdk.tar.gz -C /tmp/riscv64-sdk
          rm -f riscv64-sdk.tar.gz

          curl -fL -o loongarch64-sdk.tar.gz \
            "https://github.com/loongson/dotnet/releases/download/v10.0.110-loongarch64/dotnet-sdk-10.0.110-linux-loongarch64.tar.gz"
          tar -xzf loongarch64-sdk.tar.gz -C /tmp/loongarch64-sdk
          rm -f loongarch64-sdk.tar.gz
      - name: Restore for each SDK version and all target RIDs
        run: |
          RIDS="linux-x64 linux-arm64 linux-riscv64 linux-loongarch64"
          i=0
          while read -r VER; do
            i=$((i+1))
            SDK_DIR="/tmp/sdks/sdk$i"
            echo "########## 使用 SDK $VER ($SDK_DIR) ##########"

            # 把 riscv64/loongarch64 的 pack 目录，按这个 SDK 实际解析出的版本号补齐
            for sdk_dir in /tmp/riscv64-sdk /tmp/loongarch64-sdk; do
              for pack_dir in "$sdk_dir"/packs/*/; do
                actual_version_dir=$(find "$pack_dir" -maxdepth 1 -mindepth 1 -type d | head -1)
                [ -z "$actual_version_dir" ] && continue
                target_dir="${pack_dir}${VER}"
                if [ ! -d "$target_dir" ]; then
                  cp -r "$actual_version_dir" "$target_dir"
                fi
              done
              mkdir -p "$SDK_DIR/packs"
              cp -r "$sdk_dir"/packs/* "$SDK_DIR/packs/"
            done

            export DOTNET_ROOT="$SDK_DIR"
            export PATH="$SDK_DIR:$PATH"

            for RID in $RIDS; do
              echo "==> [$VER] Restoring for RID: $RID"
              "$SDK_DIR/dotnet" restore source/v2rayN/v2rayN.sln \
                --packages ./nuget-cache \
                -r "$RID" \
                -p:EnableWindowsTargeting=true \
                --ignore-failed-sources || echo "警告: [$VER] $RID restore 部分失败，继续下一个"
            done
          done < /tmp/sdk-versions.txt
      - name: Merge riscv64 and loongarch64 runtime packs into nuget-cache
        run: |
          for sdk_dir in /tmp/riscv64-sdk /tmp/loongarch64-sdk; do
            for dir in "$sdk_dir"/packs/*/; do
              name=$(basename "$dir")
              lower_name=$(echo "$name" | tr '[:upper:]' '[:lower:]')
              mkdir -p "./nuget-cache/$lower_name"
              cp -r "$dir"* "./nuget-cache/$lower_name/"
            done
          done
          rm -rf /tmp/riscv64-sdk /tmp/loongarch64-sdk /tmp/sdks
      - name: Optimize cache size (remove temp files)
        run: |
          find ./nuget-cache -name "*.lock" -delete
          find ./nuget-cache -name "*.tmp" -delete
      - name: Compress NuGet cache
        run: |
          tar -czf nuget-cache.tar.gz nuget-cache
      - name: Create Release with cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.nuget_cache_version }}" --repo ${{ github.repository }} --yes || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            --delete "${{ inputs.nuget_cache_version }}" || true
          gh release create "${{ inputs.nuget_cache_version }}" \
            nuget-cache.tar.gz \
            --repo ${{ github.repository }} \
            --title "${{ inputs.nuget_cache_version }}" \
            --notes "源码版本: ${{ inputs.source_ref }} / 缓存版本: ${{ inputs.nuget_cache_version }}"
