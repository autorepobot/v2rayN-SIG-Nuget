name: 🛠 Build from Source & NuGet Cache
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码版本号 (release tag) 或 master'
        required: true
        default: 'master'
      nuget_cache_version:
        description: 'nuget-cache release 版本号 (tag)'
        required: true
        default: 'nuget-cache'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone source at specified ref
        run: |
          git clone --branch "${{ inputs.source_ref }}" --depth 1 --recurse-submodules \
            https://github.com/autorepobot/v2rayN-SIG.git source

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.1xx'

      - name: Download NuGet cache from release
        run: |
          mkdir -p ~/.nuget/packages
          curl -L -o nuget-cache.tar.gz \
            "https://github.com/autorepobot/v2rayN-SIG/releases/download/${{ inputs.nuget_cache_version }}/nuget-cache.tar.gz"
          tar -xzf nuget-cache.tar.gz -C ~/.nuget/packages --strip-components=1

      - name: Restore using cached packages (offline)
        run: |
          dotnet restore source/v2rayN/v2rayN.sln -p:EnableWindowsTargeting=true

      - name: Build / publish
        run: |
          dotnet publish source/v2rayN/v2rayN.sln \
            -c Release \
            --no-restore \
            -p:EnableWindowsTargeting=true \
            -o ./publish

      - name: Package build output
        run: |
          cd publish
          zip -r ../v2rayN-${{ inputs.source_ref }}.zip .

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ inputs.source_ref }}-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" \
            v2rayN-${{ inputs.source_ref }}.zip \
            --repo ${{ github.repository }} \
            --title "Build from ${{ inputs.source_ref }} (nuget-cache: ${{ inputs.nuget_cache_version }})" \
            --notes "源码版本: ${{ inputs.source_ref }}
NuGet 缓存版本: ${{ inputs.nuget_cache_version }}"
